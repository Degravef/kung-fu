<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kung Fu · Stickboy demo</title>
  </head>
  <body>
    <div id="app">
      <aside id="tree" class="panel" aria-label="Joint list">
        <header class="panel-head">
          <h1>Stickboy</h1>
          <p class="muted">Every joint has a name. Hover or select one here or in the 3D view.</p>
          <input id="search" type="search" placeholder="Search joints…" aria-label="Search joints" autocomplete="off" />
        </header>
        <div id="tree-body"></div>
      </aside>

      <main id="stage">
        <div id="toolbar" class="bar">
          <div class="group" role="group" aria-label="Camera views" id="views"></div>
          <div class="group toggles">
            <label><input type="checkbox" id="t-labels" /> All labels</label>
            <label><input type="checkbox" id="t-bones" checked /> Bones</label>
            <label><input type="checkbox" id="t-ground" checked /> Auto-ground</label>
          </div>
          <div class="legend" aria-label="Colour legend">
            <span><i class="dot side-L"></i>Left</span>
            <span><i class="dot side-R"></i>Right</span>
            <span><i class="dot side-C"></i>Centre</span>
          </div>
        </div>

        <div id="viewport">
          <canvas id="canvas" aria-label="3D stickboy. Drag to orbit, scroll to zoom."></canvas>
          <div id="labels" aria-hidden="true"></div>
          <div id="tooltip" role="tooltip" hidden></div>
          <p id="hint" class="muted">Drag to orbit · scroll to zoom · right-drag to pan · click a joint to select · double-click to focus</p>
        </div>

        <div id="posebar" class="bar" role="group" aria-label="Poses"></div>
      </main>

      <aside id="inspector" class="panel" aria-label="Selected joint"></aside>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
