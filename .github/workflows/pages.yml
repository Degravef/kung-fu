# Test, build and publish the site to GitHub Pages on every push to main.
#
# One-time setup in the repository: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The site then lives at https://<user>.github.io/<repo>/ (the build uses relative asset paths, so the
# sub-folder is fine).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-run it by hand from the Actions tab

# Least privilege: read the code, write the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push replaces an unfinished older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A failing test stops the deployment, so a broken build never goes live.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
